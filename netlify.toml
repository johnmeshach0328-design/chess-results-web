[build]
  publish = "."

[[redirects]]
  from = "/api/fast2sms/*"
  to = "https://www.fast2sms.com/dev/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/fide-profile/:id"
  to = "https://ratings.fide.com/profile/:id"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/_expo/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
